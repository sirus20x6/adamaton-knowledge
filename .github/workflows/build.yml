name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Multi-stage Dockerfiles that build from source — context = sub-repo root.
          - service: r2g
            context: .
            dockerfile: r2g/Dockerfile
            platforms: linux/arm64
          - service: skills-rae
            context: .
            dockerfile: skills-rae/Dockerfile
            platforms: linux/arm64
          # The reranker sidecar is self-contained Python + torch (CPU wheels).
          # Build context is the sidecar dir so requirements.txt + app.py are in scope.
          - service: reranker
            context: sidecars/reranker
            dockerfile: sidecars/reranker/Dockerfile
            platforms: linux/arm64
          # The two workers below have "prebuilt-binary" style Dockerfiles
          # (they COPY a *.arm64 binary that the host's make targets emit).
          # CI doesn't currently produce those binaries, so first builds will
          # fail — flagged for follow-up to convert them to multi-stage.
          - service: skills-worker
            context: .
            dockerfile: skills/Dockerfile
            platforms: linux/arm64
          - service: reindex-worker
            context: .
            dockerfile: reindex/Dockerfile
            platforms: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sirus20x6/adamaton-knowledge-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
